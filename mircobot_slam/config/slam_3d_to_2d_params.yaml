pointcloud_to_laserscan:
  ros__parameters:
    target_frame: "lidar"
    transform_tolerance: 0.01
    min_height: 0.0
    max_height: 1.0
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.00872665
    scan_time: 0.1
    range_min: 0.3   
    range_max: 12.0
    use_inf: true
    inf_epsilon: 1e-6