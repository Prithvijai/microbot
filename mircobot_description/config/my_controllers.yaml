controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    diff_cont:
      type: diff_drive_controller/DiffDriveController
    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster

diff_cont:
  ros__parameters:
    publish_rate: 100.0
    base_frame_id: base_footprint
    odom_frame_id: odom
    left_wheel_names: ["wheel_front_left_joint", "wheel_back_left_joint"]
    right_wheel_names: ["wheel_front_right_joint", "wheel_back_right_joint"]
    wheel_separation: 0.13
    wheels_per_side: 2
    wheel_radius: 0.03
    enable_odom_tf: true
    open_loop: true

joint_broad:
  ros__parameters: {}
